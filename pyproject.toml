[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "applications"
version = "0.1.0"
description = "Poll Greenhouse, Ashby, and Lever, decide with jev, and record applications."
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
browser = ["playwright>=1.40,<2"]

[project.scripts]
applications = "applications.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
